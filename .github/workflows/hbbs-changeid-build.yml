name: Build hbbs with Change ID
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ChangeID source
        uses: actions/checkout@v4
        with:
          repository: skycobg/rustdesk-server
          ref: sky
          submodules: recursive
          path: src
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: x86_64-unknown-linux-musl
      - name: Install cross
        run: |
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin
          cross --version
      - name: Build hbbs
        working-directory: src
        run: |
          cross build --release --target x86_64-unknown-linux-musl --bin hbbs
          file target/x86_64-unknown-linux-musl/release/hbbs
          sha256sum target/x86_64-unknown-linux-musl/release/hbbs
      - name: Upload hbbs
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-changeid-musl
          path: src/target/x86_64-unknown-linux-musl/release/hbbs
